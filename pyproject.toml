[project]
name = "fairbench"
version = "0.1.0"
description = "Voice competency training with integrity auditing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
bot = [
    "pipecat-ai[gradium,webrtc,silero,openai,websocket]>=1.3.0,<2",
    "gradium",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "aiohttp>=3.9",
]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.27",
]

[project.scripts]
fairbench = "fairbench.cli:main"
fairbench-bot = "fairbench.bot.main:main"
fairbench-battery = "fairbench.battery:main"
fairbench-audit = "fairbench.cli:audit_main"
fairbench-server = "fairbench.server.app:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fairbench*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
